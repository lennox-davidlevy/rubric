# Lines for the universal catalog (catalogs/universal/catalog.yaml), each with
# the plain form a person would want, or "nothing" when no part fits.
# `place: site` lines are written in rubric.md and are asked only about the
# frame parts; the rest are asked only about the parts in the writing.
#
# Written before any run, in the words a writer would use, with the near
# misses on purpose: tabs and fold, cards and pricing and people and stats,
# quote and testimonial, callout and sidenote, video and embed, section and
# call-to-action. Not tuned against; a miss here is a finding.

# section
- { directive: a shaded box around the next few paragraphs, want: section tone=tint }
- { directive: a dark band across the whole page, want: section tone=dark width=full }
- { directive: put this in a box with a border, want: section edge=outlined }
- { directive: a card that floats above the page with a shadow, want: section edge=raised }
- { directive: set this part apart from the rest, want: section }

# hero
- { directive: a big opening for the top of the page, want: hero }
- { directive: a huge title that fills the screen, want: hero size=tall }
- { directive: a centered landing header with a photo behind it, want: hero align=center }

# quote and testimonial
- { directive: a pull quote, want: quote size=large }
- { directive: an excerpt from the letter, want: quote }
- { directive: a big centered quote from the interview, want: quote size=large align=center }
- { directive: what our customers say about us, want: testimonial }
- { directive: a review from a happy client with their photo, want: testimonial }
- { directive: a quote from a user praising the app, want: testimonial }

# callout and sidenote
- { directive: a warning before the next step, want: callout kind=warning }
- { directive: a tip for the reader, want: callout kind=tip }
- { directive: heads up, want: callout }
- { directive: a big red danger box about deleting your data, want: callout kind=danger }
- { directive: a note in the margin about this sentence, want: sidenote }
- { directive: an aside off to the side of the text, want: sidenote }

