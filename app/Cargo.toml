[package]
name = "rubric-app"
version = "0.0.1"
edition = "2024"
publish = false

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "0ca075619d116f8f6e0e3bc8ff815c72c636cac8" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "0ca075619d116f8f6e0e3bc8ff815c72c636cac8" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wry = "0.57.2"
raw-window-handle = "0.6.2"

# The web view's thread runs GTK on Linux only; elsewhere the page is not attached yet.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18.2"

[features]
# The measuring binary: Rune's per-thread CPU clock.
bench = ["rune/frame-profile"]

[[bin]]
name = "rubric-app"
path = "src/main.rs"

[[bin]]
name = "typing"
path = "src/bin/typing.rs"
required-features = ["bench"]

[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "0ca075619d116f8f6e0e3bc8ff815c72c636cac8" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "0ca075619d116f8f6e0e3bc8ff815c72c636cac8" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "0ca075619d116f8f6e0e3bc8ff815c72c636cac8" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "0ca075619d116f8f6e0e3bc8ff815c72c636cac8" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false
