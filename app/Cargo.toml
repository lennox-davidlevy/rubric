[package]
name = "rubric-app"
version = "0.0.1"
edition = "2024"
publish = false

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "41cfc073ca5845f1d689a41535d796f37a8f7eba" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "41cfc073ca5845f1d689a41535d796f37a8f7eba" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wry = "0.57.2"
raw-window-handle = "0.6.2"

# The web view's thread runs GTK on Linux only; elsewhere the page is not attached yet.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18.2"
# The web view under wry, for its settings (media) and its process ending.
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }

[features]
# The measuring binary: Rune's per-thread CPU clock.
bench = ["rune/frame-profile"]

[[bin]]
name = "rubric-app"
path = "src/main.rs"

[[bin]]
name = "typing"
path = "src/bin/typing.rs"
required-features = ["bench"]

[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "41cfc073ca5845f1d689a41535d796f37a8f7eba" }
sctk-adwaita = { git = "https://github.com/anomalyco/rune", rev = "41cfc073ca5845f1d689a41535d796f37a8f7eba" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "41cfc073ca5845f1d689a41535d796f37a8f7eba" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "41cfc073ca5845f1d689a41535d796f37a8f7eba" }
naga = { git = "https://github.com/anomalyco/rune", rev = "41cfc073ca5845f1d689a41535d796f37a8f7eba" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "41cfc073ca5845f1d689a41535d796f37a8f7eba" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "41cfc073ca5845f1d689a41535d796f37a8f7eba" }
accesskit_atspi_common = { git = "https://github.com/anomalyco/rune", rev = "41cfc073ca5845f1d689a41535d796f37a8f7eba" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false
