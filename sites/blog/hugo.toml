baseURL = "/"
title = "Field Notes"
theme = "blog"
themesDir = "../../catalogs"
disableKinds = ["sitemap"]

[params]
author = "A. Writer"

[params.rubric]
theme = "paper"

[taxonomies]
tag = "tags"

[[menus.main]]
name = "Posts"
pageRef = "/posts"
weight = 1

[[menus.main]]
name = "About"
pageRef = "/about"
weight = 2

# Nested parts hand their HTML to the outer part's RenderString.
[markup.goldmark.renderer]
unsafe = true

[markup.goldmark.extensions.footnote]
backlinkHTML = "↩︎"

[markup.highlight]
noClasses = false
