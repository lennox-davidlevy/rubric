baseURL = "/"
title = "Rubric playground"
theme = "blog"
themesDir = "../catalogs"
disableKinds = ["taxonomy", "term", "sitemap"]

[params.rubric]
theme = "paper"

# Nested parts hand their HTML to the outer part's RenderString.
[markup.goldmark.renderer]
unsafe = true

[markup.highlight]
noClasses = false
