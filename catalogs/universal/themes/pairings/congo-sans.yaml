# Congo's type (tailwind.config.js, its Tailwind Typography prose): the reader's
# own sans, an extra-bold title, a tight hierarchy. Nothing to fetch.
description: the reader's own sans with extra-bold titles and tidy, tight headings

faces: []
preload: []

body: [ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif]
display: body
mono: [ui-monospace, SFMono-Regular, Menlo, Consolas, monospace]

weight: { body: 400, strong: 600, heading: 700, display: 800 }
leading: { body: 1.75, heading: 1.3, display: 1.1 }
tracking: { display: -0.01em, label: 0.02em }

labels: none
numerals: lining
quote: italic
ornament: "* * *"
code: 0.875em
links: hover
