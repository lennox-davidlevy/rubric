# Coder's type (github.com/luizdepra/hugo-coder, MIT), from
# assets/scss/_variables.scss and _base.scss: the system sans with loose lines,
# semibold headings and medium links. Nothing to fetch.
description: the reader's own system sans, loosely set, with semibold headings

faces: []
preload: []

body: [-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Oxygen-Sans, Ubuntu, Cantarell, Helvetica Neue, Helvetica, sans-serif]
display: body
mono: [SF Mono, Consolas, Liberation Mono, Menlo, monospace]

weight: { body: 400, strong: 700, heading: 600, display: 600 }
leading: { body: 1.8, heading: 1.25, display: 1.2 }
tracking: { display: 0em, label: 0em }

labels: none
numerals: lining
quote: normal
ornament: "* * *"
code: 0.85em
links: hover
