# Terminal's type (github.com/panr/hugo-theme-terminal, MIT), from
# assets/css/main.css: Fira Code for everything, at one weight of bold, and
# nothing set in capitals. Fira Code is SIL OFL, vendored from
# @fontsource-variable/fira-code 5.3.0, the Latin subset.
description: Fira Code for everything, a programmer's monospace with joined symbols

faces:
  - { family: Fira Code, file: fira-code-normal.woff2, style: normal, weight: [300, 700] }
preload: [fira-code-normal.woff2]

body: [Fira Code, Monaco, Consolas, Ubuntu Mono, monospace]
display: body
mono: [Fira Code, Monaco, Consolas, Ubuntu Mono, monospace]

weight: { body: 400, strong: 700, heading: 700, display: 700 }
leading: { body: 1.54, heading: 1.3, display: 1.3 }
tracking: { display: 0em, label: 0em }

labels: none
numerals: lining
quote: normal
ornament: "- - -"
code: 1em
links: always
