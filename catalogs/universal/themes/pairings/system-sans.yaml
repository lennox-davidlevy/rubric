# The reader's own sans, as PaperMod sets it (assets/css/core/reset.css): no
# font files at all, so nothing to fetch. Bold headings, plain labels.
description: the reader's own system sans for everything, with bold headings

faces: []
preload: []

body: [-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Oxygen, Ubuntu, Cantarell, Open Sans, Helvetica Neue, sans-serif]
display: body
mono: [ui-monospace, SF Mono, Menlo, Consolas, Liberation Mono, monospace]

weight:
  body: 400
  strong: 700
  heading: 700
  display: 700

leading:
  body: 1.6
  heading: 1.2
  display: 1.2

tracking:
  display: 0em
  label: 0.06em   # the pager's PREV and NEXT, 1px at 0.8rem

labels: uppercase
numerals: lining
quote: normal       # a blockquote is a rule beside upright writing
ornament: "* * *"
code: 0.78em
links: always
