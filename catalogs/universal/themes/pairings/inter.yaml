# hello-friend-ng's type (github.com/rhazdon/hugo-theme-hello-friend-ng, MIT),
# from assets/scss/_main.scss: Inter, spaced out a little. SIL OFL, vendored
# from @fontsource-variable/inter 5.3.0, the Latin subset.
description: Inter for everything, a clean interface sans, a little spaced out

faces:
  - { family: Inter, file: inter-normal.woff2, style: normal, weight: [100, 900] }
  - { family: Inter, file: inter-italic.woff2, style: italic, weight: [100, 900] }
preload: [inter-normal.woff2]

body: [Inter, -apple-system, BlinkMacSystemFont, Roboto, Segoe UI, Helvetica, Arial, sans-serif]
display: body
mono: [ui-monospace, SF Mono, Menlo, Consolas, monospace]

weight: { body: 400, strong: 600, heading: 600, display: 700 }
leading: { body: 1.54, heading: 1.3, display: 1.25 }
tracking: { body: 0.02em, display: 0em, label: 0.06em }

labels: none
numerals: lining
quote: normal
ornament: "* * *"
code: 0.9em
links: always
