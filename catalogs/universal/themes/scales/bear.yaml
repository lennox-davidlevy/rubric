# Bear Blog's sizes (layouts/partials/style.html): the browser's 16px and its
# heading sizes, a 720px column less its gutters, dashed rules, 3px corners.
description: 16px writing with plain headings in a 680px column, and dashed rules

screen: [360, 1240]
body: [16, 16]
ratio: [1.2, 1.25]
steps: [-1, 4]
space: [0.5, 1, 1.25, [1.75, 2], [2.5, 3]]
measure: 42.5rem  # --width 720px less 20px either side
wide: 45rem       # nothing in Bear is wider than the page
radius: 3px
border: 1px
rules: dashed
