# Congo's avocado scheme (github.com/jpanther/congo, MIT), from
# assets/css/schemes/avocado.css, assigned the way its tailwind.config.js does for
# its prose and its dark mode.
description: white, neutral gray writing and an avocado green, with a dark neutral dark

scheme: light

paper: "#ffffff"
ink: "#44403c"
heading: "#292524"
link: "#49760e"  # nudged from #4d7c0f, to read
accent: "#4d7c0f"
muted: "#726b67"  # nudged from #78716c, to read
rule: "#e7e5e4"
tint: "#f5f5f4"
code-paper: "#fafaf9"
code-muted: "#706e6b"
positive: "#15803d"
warning: "#995d07"  # nudged from #a16207, to read
danger: "#b91c1c"

dark:
  paper: "#292524"
  ink: "#d6d3d1"
  heading: "#e7e5e4"
  link: "#a3e635"
  accent: "#a3e635"
  muted: "#b0aba8"  # nudged from #a8a29e, to read
  rule: "#57534e"
  tint: "#44403c"
  danger: "#cf8d8c"

shadow:
  strength: 1
