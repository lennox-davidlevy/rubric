# Relearn's relearn-light variant (github.com/McShelby/hugo-theme-relearn, MIT), from
# assets/css/theme-relearn-light.css, with relearn-light's values for what it leaves out. Its
# menu color is the band. Its notices are its own box colors.
description: white with a blue link, a bright green mark and a near-black menu

scheme: light

paper: "#ffffff"
ink: "#262626"
band: "#282828"
band-ink: "#ffffff"
heading: "#101010"
link: "#4465bf"  # nudged from #486ac9, to read
accent: "#4b7803"  # nudged from #7dc903, to read
muted: "#6b6b6b"
rule: "#d0d0d0"
tint: "#f8f8f8"
code-accent: "#4f7e03"
positive: "#2e7d32"
warning: "#ab4f09"  # nudged from #b45309, to read
danger: "#c62828"

dark:
  paper: "#202020"
  ink: "#d2d2d2"
  link: "#7a97e5"  # nudged from #6c8ce3, to read
  accent: "#7a97e5"  # nudged from #6c8ce3, to read
