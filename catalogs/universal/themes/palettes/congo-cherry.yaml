# Congo's cherry scheme (github.com/jpanther/congo, MIT), from
# assets/css/schemes/cherry.css, assigned the way its tailwind.config.js does for
# its prose and its dark mode.
description: white, neutral gray writing and a cherry red and a warm stone gray, with a dark neutral dark

scheme: light

paper: "#ffffff"
ink: "#404040"
heading: "#262626"
link: "#be123c"
accent: "#be123c"
muted: "#6d6d6d"  # nudged from #737373, to read
rule: "#e5e5e5"
tint: "#f5f5f5"
code-paper: "#fafafa"
code-muted: "#6e6e6e"
positive: "#15803d"
warning: "#995d07"  # nudged from #a16207, to read
danger: "#b91c1c"

dark:
  paper: "#262626"
  ink: "#d4d4d4"
  heading: "#e5e5e5"
  link: "#fb8b9c"  # nudged from #fb7185, to read
  accent: "#fb8b9c"  # nudged from #fb7185, to read
  muted: "#acacac"  # nudged from #a3a3a3, to read
  rule: "#525252"
  tint: "#404040"
  danger: "#ce8d8d"

shadow:
  strength: 1
