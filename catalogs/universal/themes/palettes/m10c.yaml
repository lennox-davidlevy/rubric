accent: "#57cc8a"
muted: "#9ba6b0"
rule: "#4d545d"
tint: "#242930"
positive: "#57cc8a"
warning: "#e5c07b"
danger: "#ff9a9a"

dark:
  paper: "#242930"
  ink: "#afbac4"
  heading: "#ffffff"
  link: "#57cc8a"
  accent: "#57cc8a"
  muted: "#9aa1a9"
