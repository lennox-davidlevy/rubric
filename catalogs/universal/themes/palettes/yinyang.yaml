warning: "#8a5c00"
danger: "#cf222e"

dark:
  paper: "#1a1a1a"
  ink: "#e0e0e0"
  link: "#b0b0b0"
  accent: "#c490b0"
  muted: "#a0a0a0"
  rule: "#8b5a7a"
