# Hyde's colors (github.com/spf13/hyde, MIT), from assets/css/hyde.css and
# poole.css. Its sidebar is the band, kept in its own color; the writing on it
# turns dark where white would not read. Its dark band is a plain near-black.
description: white, soft gray writing and a burnt orange, with a sidebar in the same color

scheme: light

paper: "#ffffff"
ink: "#515151"
band: "#d28445"
band-ink: "#2f2f2f"  # nudged from #ffffff, to read
heading: "#313131"
link: "#9b6133"  # nudged from #d28445, to read
accent: "#9b6133"  # nudged from #d28445, to read
muted: "#717171"
rule: "#e5e5e5"
tint: "#f9f9f9"
code-accent: "#9b6133"
positive: "#1a7f37"
warning: "#8a5c00"
danger: "#aa5159"  # nudged from #b3555e, to read

dark:
  paper: "#202020"
  ink: "#e8e8e8"
  link: "#8fc3e8"
  accent: "#8fc3e8"
