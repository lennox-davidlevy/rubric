# Cactus's classic scheme (github.com/monkeyWzr/hugo-theme-cactus, MIT), from
# assets/scss/colors/classic.scss.
description: off-white, dark slate and a sage link with a cherry accent

scheme: light

paper: "#fafafa"
ink: "#22272a"
heading: "#22272a"
link: "#4a6a66"  # nudged from #567c77, to read
accent: "#c2283e"  # nudged from #cc2a41, to read
muted: "#666666"
rule: "#d0d0d0"
tint: "#e9e9e9"  # nudged from #f5f5f5, to read
positive: "#3c6e5a"
warning: "#8a5c00"
danger: "#c2283e"  # nudged from #cc2a41, to read

dark:
  paper: "#1d1f21"
  ink: "#c9cacc"
  heading: "#eeeeee"
  link: "#d480aa"
  accent: "#2bbc8a"
  muted: "#979797"  # nudged from #8c8c8c, to read
  rule: "#444444"
