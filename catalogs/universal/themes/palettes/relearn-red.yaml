# Relearn's red variant (github.com/McShelby/hugo-theme-relearn, MIT), from
# assets/css/theme-red.css, with relearn-light's values for what it leaves out. Its
# menu color is the band. Its notices are its own box colors.
description: white with a red link and a dark red-brown menu

scheme: light

paper: "#ffffff"
ink: "#515151"
band: "#312525"
band-ink: "#ffffff"
heading: "#222222"
link: "#d01919"  # nudged from #f31c1c, to read
accent: "#d10f0f"  # nudged from #dc1010, to read
muted: "#6b6b6b"
rule: "#d0d0d0"
tint: "#f8f8f8"
positive: "#2e7d32"
warning: "#ab4f09"  # nudged from #b45309, to read
danger: "#c62828"

dark:
  paper: "#202020"
  ink: "#d2d2d2"
  link: "#7a97e5"  # nudged from #6c8ce3, to read
  accent: "#7a97e5"  # nudged from #6c8ce3, to read
