{{- $labels := dict "note" "Note" "tip" "Tip" "warning" "Warning" "danger" "Danger" -}}
{{- $label := .s.title | default (index $labels .s.kind) -}}
<aside class="part part-callout kind-{{ .s.kind }}" aria-label="{{ $label }}">
<p class="part-callout-label" aria-hidden="true">{{ partial "rubric/callout-icon.html" .s.icon }}{{ $label }}</p>
<div class="stack">
{{ .inner }}
</div>
</aside>
