{{- $url := .page.Permalink -}}
{{- $title := .page.Title -}}
<nav class="part part-share" aria-label="Share">
<span class="part-share-label">Share</span>
<a href="mailto:?subject={{ $title | urlquery }}&amp;body={{ $url | urlquery }}">Email</a>
<a href="https://x.com/intent/post?text={{ $title | urlquery }}&amp;url={{ $url | urlquery }}">X</a>
<a href="https://www.linkedin.com/sharing/share-offsite/?url={{ $url | urlquery }}">LinkedIn</a>
</nav>
