{{- /* Each ## heading is a tab. Without the script the panels are headings
     and sections, one after another; js/parts/tabs.js makes them tabs. */ -}}
{{- $x := partial "rubric/sections.html" (dict "html" .inner "level" 2 "parts" false) -}}
<div class="part part-tabs">
{{- range $x.items }}
<section class="part-tabs-panel">
<h2 class="part-tabs-title"{{ with .id }} id="{{ . }}"{{ end }}>{{ .title }}</h2>
<div class="stack">
{{ .body }}
</div>
</section>
{{- end }}
</div>
