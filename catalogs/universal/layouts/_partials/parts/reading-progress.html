{{- /* How far down the page the reader is: a bar across the top, or a ruler
     of ticks down the side with the share read. Drawn by its script; with
     none, nothing shows. */ -}}
<div class="part part-reading-progress style-{{ .s.style }}" aria-hidden="true">
<span class="part-reading-progress-mark"><span class="part-reading-progress-value">0.00</span></span>
</div>
