# What the Blowfish skin adds to the catalog while it is the site's skin.
# Jev reads these too. Anything a second skin also has moves into
# catalog.yaml, so every skin gets it. Bump the version when a description
# changes.
name: blowfish
version: 1

parts:
  # Blowfish's alert takes an icon; ours is a callout.
  callout:
    settings:
      icon:
        type: choice
        default: none
        values:
          none: no icon
          lightbulb: a lightbulb, for a tip or an idea
          info: a letter i in a circle, for something to know
          warning: a triangle with an exclamation mark, for a warning
          check: a check mark, for something done or right
          star: a star, for something special
          fire: a flame, for something urgent or exciting

  # Blowfish's lead: an opening paragraph set larger than the rest.
  lead:
    description: An opening paragraph set larger than the rest of the writing, to lead into it.
    children: true
    body: |
      A sentence or two that sets up what follows.
