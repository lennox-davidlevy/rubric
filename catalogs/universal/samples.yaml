# What the catalog page puts inside each part. Not part of the contract and
# never sent to Jev: catalog.yaml says what a part is, this says what to show
# in it. `settings` are added to every item of the part; `extra` adds items
# beyond one per value; `pair` shows a setting together with others, for a
# setting that cannot be seen on its own.

section:
  md: |
    ## A few words set apart

    A run of writing that belongs together and wants a little room of its own. It reads like the rest of the page, with [a link](#) in it, until the setting says otherwise.
  pair:
    width: { tone: tint }
  extra:
    - { tone: dark, width: full }

