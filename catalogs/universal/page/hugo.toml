# The catalog page, as its own small site over the catalog module. Serve it
# with `hugo server -s catalogs/blog/page`; each theme is a page.
baseURL = "/"
title = "Universal catalog"
theme = "universal"
themesDir = "../.."
disableKinds = ["taxonomy", "term", "rss", "sitemap"]

[markup.goldmark.renderer]
unsafe = true

[markup.highlight]
noClasses = false

# For `hugo server` only. Its Last-Modified is to the second, so two rebuilds
# in one second answer the browser's reload with 304 Not Modified and the
# browser keeps the older page. Rubric rebuilds as the writer types, so this
# happens often. Hugo reads this from the site only, never from a theme.
[[server.headers]]
for = "/**"
[server.headers.values]
Cache-Control = "no-store"

[params]
author = "A. Writer"
email = "hello@example.com"
