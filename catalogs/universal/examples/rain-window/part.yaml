name: rain-window
description: A heading seen through a window, with rain running down the glass behind it.
children: true
body: |
  ## Your heading

  A line or two beneath it.
settings:
  rain:
    type: choice
    default: steady
    values:
      drizzle: a few slow drops
      steady: an even rain
      downpour: heavy, fast rain
  size:
    type: choice
    default: medium
    values:
      small: a small window
      medium: a window of ordinary size
      large: a tall, wide window
  opacity:
    type: choice
    default: solid
    values:
      solid: the heading on a patch wiped clear
      misty: rain faintly showing behind the heading
      sheer: rain plainly showing behind the heading
