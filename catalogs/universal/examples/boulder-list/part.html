{{- $x := partial "rubric/sections.html" (dict "html" .inner "level" 3) -}}
<div class="part part-boulder-list size-{{ .s.size }}">
{{- with trim (string $x.before) " \n" }}<div class="stack part-boulder-list-intro">{{ . | safeHTML }}</div>{{ end }}
<ul>
{{- range $i, $it := $x.items }}
{{- $k := mod $i 6 }}
<li>
<span class="boulder" aria-hidden="true"><svg viewBox="0 0 48 40" preserveAspectRatio="xMidYMax meet" focusable="false">
{{- if eq $k 0 }}
<!-- A single round boulder. -->
<path class="b-shape" d="M6 40 C3 33 4 22 10 15 C15 9 24 6 31 8 C38 10 44 17 45 26 C46 32 44 37 41 40 Z"/>
<path class="b-line" d="M11 14 C16 19 19 25 19 32 M19 25 C25 21 31 20 37 22 C40 26 41 31 40 37"/>
<path class="b-hatch" d="M39 29 L44.6 23.6 M38 33 L44.8 26.4 M37 37 L44.4 29.8 M38.5 39.6 L43.8 34.4"/>
<path class="b-line" d="M1.5 40 C1.5 38.4 3.6 37.6 5 39"/>
<circle class="b-dot" cx="24" cy="14" r="0.7"/><circle class="b-dot" cx="27" cy="30" r="0.7"/><circle class="b-dot" cx="13" cy="29" r="0.7"/>
{{- else if eq $k 1 }}
<!-- A pair of boulders, one large and one small. -->
<path class="b-shape" d="M3 40 C2 32 4 22 10 17 C15 12 23 11 28 14 C33 17 34 25 33 32 C32.5 36 32 38 31 40 Z"/>
<path class="b-line" d="M10 17 C13 22 14 28 13 35 M13 26 C18 23 24 22 29 24"/>
<path class="b-hatch" d="M22 37 L29 30 M25 39.6 L31 33.6 M19 39.6 L27 31.6"/>
<path class="b-shape" d="M30 40 C29 35 32 30 37 29 C42 28 46 32 46 36 C46 38 45.5 39 45 40 Z"/>
<path class="b-line" d="M37 29 C36 33 37 36 39 40"/>
<path class="b-hatch" d="M41 39.6 L45.6 35 M43.6 39.6 L46 37.2"/>
<circle class="b-dot" cx="18" cy="18" r="0.7"/><circle class="b-dot" cx="21" cy="32" r="0.7"/><circle class="b-dot" cx="40" cy="33" r="0.6"/>
{{- else if eq $k 2 }}
<!-- A wide, flat slab with layers in it. -->
<path class="b-shape" d="M2 40 C1 36 2 31 6 28 C12 25 22 24 32 24.5 C39 25 45 27 46 31 C47 35 46 38 45 40 Z"/>
<path class="b-line" d="M6 28 C10 31 20 32 32 31.5 C38 31.2 43 31 46 31"/>
<path class="b-line" d="M4 35 C14 36.5 26 36.5 35 36 M38 35.6 C41 35.4 43 35.1 46.2 34.8 M12 31.6 L13 34 L12 37"/>
<path class="b-hatch" d="M34 39.6 L36.5 33 M38 39.6 L40.5 33 M42 39.6 L44.5 33"/>
<circle class="b-dot" cx="14" cy="28" r="0.7"/><circle class="b-dot" cx="24" cy="27.5" r="0.7"/><circle class="b-dot" cx="36" cy="28" r="0.7"/>
{{- else if eq $k 3 }}
<!-- A tall standing stone. -->
<path class="b-line" d="M5.5 40 C6 38.5 8.6 38.4 9.4 40 M36.5 40 C36.6 38 39.2 37.6 40.6 40"/>
<path class="b-shape" d="M13 40 C12 32 12 20 14 11 C15.5 5 19 2 24 2.5 C29 3 32 7 33 13 C34.5 22 35 32 35 40 Z"/>
<path class="b-line" d="M24 2.5 C22 8 22 14 23 20 C24 28 24 34 23 40 M16.5 15 C17.5 17 17.5 19 16.5 21"/>
<path class="b-hatch" d="M25.5 12 L32 9 M25.5 17 L33 13.5 M25.5 22 L33.6 18.5 M25.5 27 L34 23 M25 32 L34.4 28 M25 37 L34.8 32.5"/>
<circle class="b-dot" cx="18" cy="28" r="0.7"/><circle class="b-dot" cx="19.5" cy="34" r="0.7"/><circle class="b-dot" cx="20" cy="8" r="0.6"/>
{{- else if eq $k 4 }}
<!-- A boulder split by a crack. -->
<path class="b-shape" d="M4 40 C2 31 5 21 12 16 C18 11 27 10 34 13 C41 16 45 24 45 31 C45 35 44 38 42 40 Z"/>
<path class="b-line" d="M12 16 C14 21 15 26 14 33"/>
<path class="b-crack" d="M25 10.8 L23 16 L26 20 L22.5 26 L25.5 31 L23 36 L24 40 M26 20 L30 22 M22.5 26 L19 27.5"/>
<path class="b-hatch" d="M38 34 L44.4 27.6 M37 38.6 L44.8 30.8 M41 39.6 L44.8 35.8"/>
<circle class="b-dot" cx="31" cy="19" r="0.7"/><circle class="b-dot" cx="17" cy="22" r="0.7"/><circle class="b-dot" cx="33" cy="30" r="0.7"/>
{{- else }}
<!-- Two boulders stacked. -->
<path class="b-shape" d="M2 40 C1 35 3 29 9 27 C17 24.5 31 24.5 39 26.5 C44 28 46.5 32 46 36 C45.8 38 45.5 39 45 40 Z"/>
<path class="b-line" d="M9 27 C11 31 12 35 11 40 M14 29 C20 30.2 28 30.2 35 29"/>
<path class="b-hatch" d="M33 39.6 L38.4 32.6 M37 39.6 L43 31.8 M41 39.6 L45.8 33.4"/>
<path class="b-shape" d="M12 27 C10 21 12 13 18 9 C23 6 30 7 34 11 C37 14 38 20 36 25 C35.5 26 35 27 34.5 27.5 Z"/>
<path class="b-line" d="M18 9 C20 14 21 19 20 26"/>
<path class="b-hatch" d="M29 26 L35.5 19.5 M32 27 L36.8 22.2 M30 18 L35.8 12.6"/>
<circle class="b-dot" cx="25" cy="15" r="0.7"/><circle class="b-dot" cx="26" cy="35" r="0.7"/><circle class="b-dot" cx="18" cy="34" r="0.7"/>
{{- end }}
</svg></span>
<div class="boulder-text">
{{ with $it.title }}<h3>{{ . }}</h3>{{ end }}
<div class="stack">{{ $it.body }}</div>
</div>
</li>
{{- end }}
</ul>
</div>
