name: tide-chart
description: A list of items, each sitting on a wave of water a little higher than the one before, like a rising tide.
children: true
body: |
  ### First item

  A line about it.

  ### Second item

  A line about it.

  ### Third item

  A line about it.

  ### Fourth item

  A line about it.
settings:
  rise:
    type: choice
    default: steady
    values:
      gentle: the water climbs a little with each item
      steady: the water climbs evenly with each item
      steep: the water climbs a lot with each item
  pace:
    type: choice
    default: slow
    values:
      still: the waves hold still
      slow: the waves roll slowly
      lively: the waves roll briskly
