{{ define "main" }}
<article>
{{ if not .IsHome }}<h1>{{ .Title }}</h1>{{ end }}
{{ .Content }}
<ul class="post-list">
{{ range site.RegularPages.ByDate.Reverse }}
<li><a href="{{ .RelPermalink }}">{{ .Title }}</a> <span class="date">{{ .Date.Format "2 Jan 2006" }}</span></li>
{{ end }}
</ul>
</article>
{{ end }}
