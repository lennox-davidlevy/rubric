# The catalog as a Hugo theme module. catalog.yaml is mounted as data so the
# shortcodes validate their settings against the same file Jev's questions are
# generated from.

[[module.mounts]]
source = "catalog.yaml"
target = "data/catalog.yaml"

[[module.mounts]]
source = "layouts"
target = "layouts"

[[module.mounts]]
source = "assets"
target = "assets"
