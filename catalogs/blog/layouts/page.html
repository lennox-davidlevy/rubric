{{ define "main" }}
<header class="page-header">
<h1>{{ .Title }}</h1>
{{- if eq .Section "posts" }}
<p class="byline">
  <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
  <span aria-hidden="true">·</span> {{ .ReadingTime }} min read
</p>
{{- end }}
</header>
{{ partial "rubric/content.html" . }}
{{- with .GetTerms "tags" }}
<p class="tags">
  {{- range . }}<a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>{{ end }}
</p>
{{- end }}
{{ end }}
