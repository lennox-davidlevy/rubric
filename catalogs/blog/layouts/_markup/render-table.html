{{- /* A Markdown table, in a box that scrolls sideways on its own when the
     table is wider than the screen, so the page never does. */ -}}
<div class="table" role="region" tabindex="0"{{ with .Attributes.caption }} aria-label="{{ . }}"{{ end }}>
<table{{ range $k, $v := .Attributes }}{{ if ne $k "caption" }} {{ $k }}="{{ $v }}"{{ end }}{{ end }}>
  <thead>
    {{- range .THead }}
    <tr>
      {{- range . }}
      <th{{ with .Alignment }} style="text-align: {{ . }}"{{ end }}>{{ .Text }}</th>
      {{- end }}
    </tr>
    {{- end }}
  </thead>
  <tbody>
    {{- range .TBody }}
    <tr>
      {{- range . }}
      <td{{ with .Alignment }} style="text-align: {{ . }}"{{ end }}>{{ .Text }}</td>
      {{- end }}
    </tr>
    {{- end }}
  </tbody>
</table>
</div>
{{- /**/ -}}
